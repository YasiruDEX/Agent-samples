openapi: 3.0.3
info:
  title: SSE OpenAI Chatbot Agent
  description: |
    A custom API agent powered by OpenAI with SSE streaming support.
  version: 1.0.0
servers:
  - url: http://localhost:9099
paths:
  /chat:
    post:
      summary: Chat with the agent using SSE streaming
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatRequest"
      responses:
        '200':
          description: Successful stream response
          content:
            text/event-stream:
              schema:
                type: string
components:
  schemas:
    ChatRequest:
      type: object
      required:
        - session_id
        - message
      properties:
        session_id:
          type: string
        message:
          type: string
